<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:section name="Main">
        <f:if condition="{record.ps14_tabs_items}">
            <f:comment><!-- Ohne initial aktiven Reiter ist der erste aktiv --></f:comment>
            <f:variable name="hasActive" value="0" />
            <f:for each="{record.ps14_tabs_items}" as="item">
                <f:if condition="{item.active}">
                    <f:variable name="hasActive" value="1" />
                </f:if>
            </f:for>

            <div class="tabs">
                <div class="tabs__list" role="tablist">
                    <f:for each="{record.ps14_tabs_items}" as="item" iteration="iterator">
                        <f:variable name="selected">{f:if(condition: '{item.active} || ({iterator.isFirst} && !{hasActive})', then: 'true', else: 'false')}</f:variable>
                        <button class="tabs__tab" id="tab-{item.uid}" type="button" role="tab" aria-controls="tab-panel-{item.uid}" aria-selected="{selected}" tabindex="{f:if(condition: '{selected} == \'true\'', then: '0', else: '-1')}">{item.title}</button>
                    </f:for>
                </div>

                <f:for each="{record.ps14_tabs_items}" as="item" iteration="iterator">
                    <f:variable name="selected">{f:if(condition: '{item.active} || ({iterator.isFirst} && !{hasActive})', then: 'true', else: 'false')}</f:variable>
                    <div class="tabs__panel" id="tab-panel-{item.uid}" role="tabpanel" aria-labelledby="tab-{item.uid}" tabindex="0" {f:if(condition: '{selected} == \'false\'', then: 'hidden')}>
                        <f:if condition="{item.recordType} == 'content'">
                            <f:then>
                                <f:for each="{item.content}" as="child">
                                    <f:cObject typoscriptObjectPath="tt_content" data="{child}" table="tt_content" />
                                </f:for>
                            </f:then>
                            <f:else>
                                <f:render partial="Content/Bodytext" arguments="{bodytext: item.description}" />
                            </f:else>
                        </f:if>
                    </div>
                </f:for>
            </div>
        </f:if>
    </f:section>
</html>
